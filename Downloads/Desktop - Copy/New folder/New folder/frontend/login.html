<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login | MyApp</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Marquee Header */
        .marquee-box {
            width: 100%;
            background: rgba(0,0,0,0.2);
            color: #fff;
            padding: 10px 0;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
        }

        .login-container {
            background: #fff;
            padding: 30px 25px;
            width: 100%;
            max-width: 380px;
            border-radius: 14px;
            box-shadow: 0 18px 40px rgba(0,0,0,0.25);
            margin-top: 20px;
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-container h1 {
            text-align: center;
            margin-bottom: 6px;
            color: #333;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* Inner box */
        .form-box {
            background: #f9fafb;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            margin-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #555;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 11px 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
            font-size: 14px;
            background: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: border 0.3s, box-shadow 0.3s, transform 0.2s;
        }

        input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79,70,229,0.15), 0 6px 14px rgba(0,0,0,0.15);
            transform: translateY(-1px);
        }

        .error {
            color: red;
            font-size: 13px;
            margin-top: 4px;
            display: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #4f46e5;
            border: none;
            color: #fff;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 10px 22px rgba(79,70,229,0.45);
            transition: background 0.3s, transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            background: #4338ca;
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(79,70,229,0.55);
        }

        .footer-text {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #555;
        }

        .footer-text a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Marquee -->
    <div class="marquee-box">
        <marquee behavior="scroll" direction="left">
            🔐 Welcome Back | Secure Login Portal | Learn • Grow • Succeed 🚀
        </marquee>
    </div>

    <div class="login-container">
        <h1>Login 🔑</h1>
        <div class="subtitle">Access your account securely ✨</div>

        <div class="form-box">
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">📧 Email</label>
                    <input type="email" id="email" placeholder="Enter your email" />
                    <div class="error" id="emailError">Please enter a valid email</div>
                </div>

                <div class="form-group">
                    <label for="password">🔒 Password</label>
                    <input type="password" id="password" placeholder="Enter your password" />
                    <div class="error" id="passwordError">Password must be at least 6 characters</div>
                </div>

                <button type="submit" class="btn">🚀 Login</button>
            </form>
        </div>

        <div class="footer-text">
            Don't have an account? <a href="signup.html">Sign Up Here</a>
        </div>
    </div>

    <script>
        const form = document.getElementById("loginForm");
        const email = document.getElementById("email");
        const password = document.getElementById("password");

        const emailError = document.getElementById("emailError");
        const passwordError = document.getElementById("passwordError");

        form.addEventListener("submit", function(e) {
            e.preventDefault();

            let isValid = true;

            if (email.value.trim() === "" || !email.value.includes("@")) {
                emailError.style.display = "block";
                isValid = false;
            } else {
                emailError.style.display = "none";
            }

            if (password.value.length < 6) {
                passwordError.style.display = "block";
                isValid = false;
            } else {
                passwordError.style.display = "none";
            }

            if (isValid) {
                alert("✅ Login successful! (Demo)");
                form.reset();
            }
        });
    </script>

</body>
</html>
